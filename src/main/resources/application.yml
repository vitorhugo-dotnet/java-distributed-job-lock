spring:
  application:
    name: distributed-job-lock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joblock}
    username: ${DB_USER:joblock}
    password: ${DB_PASSWORD:joblock}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}

job:
  billing-close:
    name: billing-close
    cron: "0 * * * * *"
    lock-at-most-for: PT2M
    lock-at-least-for: PT10S

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${app.instance-id:local}]"

---
spring:
  config:
    activate:
      on-profile: docker
  flyway:
    locations: classpath:db/migration,classpath:db/seed
