services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: joblock
      POSTGRES_USER: joblock
      POSTGRES_PASSWORD: joblock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblock -d joblock"]
      interval: 5s
      timeout: 5s
      retries: 10
